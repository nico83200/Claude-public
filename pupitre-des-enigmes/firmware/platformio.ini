; Le Pupitre des Énigmes — programme de l'ESP32 WROOM.
;   pio run                  compiler
;   pio run -t upload        téléverser (débrancher le fil de la GPIO 2 si ça échoue)
;   pio device monitor       journal série à 115 200 bauds

[env:pupitre]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Les polices accentuées prennent de la place : grande partition d'application, sans OTA.
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    miguelbalboa/MFRC522@1.4.11
    dfrobot/DFRobotDFPlayerMini@1.0.6
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@7.2.1
