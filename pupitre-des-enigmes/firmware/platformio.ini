; Le Pupitre des Énigmes — programme de l'ESP-32S (ESP32-WROOM-32, USB-C, CH340).
;   pio run                  compiler
;   pio run -t upload        téléverser (débrancher le fil de la GPIO 2 si ça échoue)
;   pio device monitor       journal série à 115 200 bauds

[platformio]
default_envs = pupitre

[env:pupitre]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460 800 bauds : fiable avec la puce USB CH340 (921 600 échoue sur certains clones)
upload_speed = 460800
monitor_filters = esp32_exception_decoder
; Deux partitions d'application de 1,9 Mo : de quoi mettre le programme à jour par le Wi-Fi
; (la nouvelle version s'écrit dans l'autre partition). La première fois, téléverser par l'USB.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    miguelbalboa/MFRC522@1.4.11
    dfrobot/DFRobotDFPlayerMini@1.0.6
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@7.2.1

; La mise à jour par le Wi-Fi : l'ordinateur connecté au réseau « Pupitre-des-Enigmes », puis
;   pio run -e pupitre-wifi -t upload
; (ou, sans PlatformIO : la page http://192.168.4.1, onglet « Mise à jour », avec firmware.bin).
[env:pupitre-wifi]
extends = env:pupitre
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=enigmes123
