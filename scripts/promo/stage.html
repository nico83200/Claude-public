<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,'Inter Display',system-ui;-webkit-font-smoothing:antialiased}
body{background:transparent}
#bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#1f5f44 0%,#0d3122 55%,#081f15 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
#phone{position:absolute;left:240px;top:560px;width:600px;height:1252px;border-radius:84px;background:#0b0f0d;box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.08) inset}
#screen{position:absolute;left:20px;top:20px;width:560px;height:1212px;border-radius:66px;background:#000}
#notch{position:absolute;left:50%;top:34px;width:150px;height:40px;margin-left:-75px;border-radius:24px;background:#0b0f0d}
.cap{position:absolute;left:60px;right:60px;text-align:center;color:#fff}
.k{font-weight:600;font-size:44px;color:#c2a47e;letter-spacing:-.01em}
.h{font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-.035em}
.s{font-weight:500;font-size:40px;color:rgba(255,255,255,.78);line-height:1.25}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
#end img{width:260px;height:260px;border-radius:22%;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.pill{display:inline-block;margin-top:46px;padding:26px 54px;border-radius:999px;background:#fff;color:#0d3122;font-weight:800;font-size:48px}
/* mode « contour » : seulement le corps du téléphone, écran évidé */
body.bezel #bg,body.bezel .cap,body.bezel #end,body.bezel .glow{display:none}
body.bezel #screen{background:transparent;box-shadow:0 0 0 40px #0b0f0d}
body.bezel #phone{background:transparent;box-shadow:none;overflow:hidden}
</style></head><body>
<div id="bg"></div>
<div class="glow" style="width:700px;height:700px;left:-250px;top:-200px;background:#579675"></div>
<div class="glow" style="width:600px;height:600px;right:-260px;bottom:120px;background:#c2a47e"></div>
<div id="phone"><div id="screen"></div><div id="notch"></div></div>
<div id="caps"></div>
<div id="end"><img src="icon-512.png"><div style="margin-top:48px;font-weight:800;font-size:110px;letter-spacing:-.04em">Jack&amp;Cie</div>
<div class="s" style="margin-top:18px;max-width:820px">Toute la vie de votre cheval,<br>réunie dans votre poche.</div>
<div class="pill">Essai gratuit 14 jours</div><div class="s" style="margin-top:34px;font-size:36px">Lien en bio</div></div>
<script>
const scenes = [
  { a: 0, b: 2.6, top: 640, k: '', h: 'Le carnet de<br>votre cheval…', s: '…tient enfin dans votre poche.', full: true },
  { a: 2.6, b: 7.0, top: 150, k: 'Soins · séances · rendez-vous', h: 'Tout au même<br>endroit.' },
  { a: 7.0, b: 12.0, top: 150, k: 'Assistant vocal', h: 'Dites-le.<br>C\'est noté.' },
  { a: 12.0, b: 16.0, top: 150, k: 'Maréchal · vaccins', h: 'Rappels<br>automatiques.' },
  { a: 16.0, b: 20.0, top: 150, k: 'Pension · dépenses', h: 'Votre budget,<br>toujours à jour.' },
];
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const caps = document.getElementById('caps');
caps.innerHTML = scenes.map((s, i) => `<div class="cap" id="c${i}" style="top:${s.top}px">${s.k ? `<div class="k">${s.k}</div>` : ''}<div class="h" style="margin-top:${s.k ? 18 : 0}px">${s.h}</div>${s.s ? `<div class="s" style="margin-top:34px">${s.s}</div>` : ''}</div>`).join('');
window.render = (t) => {
  scenes.forEach((s, i) => {
    const el = document.getElementById('c' + i);
    const inn = ease((t - s.a) / 0.45), out = s.b < 20 && i < scenes.length - 1 ? ease((t - (s.b - 0.25)) / 0.25) : (t >= 20 ? ease((t - 20) / 0.3) : 0);
    const visible = t >= s.a - 0.01 && t < s.b + 0.3;
    el.style.opacity = visible ? Math.max(0, inn - out) : 0;
    el.style.transform = `translateY(${(1 - inn) * 40 - out * 20}px)`;
  });
  // téléphone : monte de 2,6 à 3,0 s, part de 19,8 à 20,2 s
  const ph = document.getElementById('phone');
  const up = ease((t - 2.6) / 0.4), down = ease((t - 19.8) / 0.4);
  ph.style.transform = `translateY(${(1 - up) * 1400 + down * 1400}px)`;
  ph.style.opacity = t < 2.6 ? 0 : 1;
  const end = document.getElementById('end');
  const e = ease((t - 20.1) / 0.5);
  end.style.opacity = e; end.style.transform = `scale(${0.92 + 0.08 * e})`;
  const pill = end.querySelector('.pill'); const p = (Math.sin((t - 21) * 4) + 1) / 2;
  pill.style.transform = t > 21 ? `scale(${1 + 0.03 * p})` : '';
};
render(0);
</script></body></html>
