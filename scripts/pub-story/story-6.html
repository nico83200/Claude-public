<!doctype html><html><head><meta charset="utf-8"><style>
/* Publicité story v6, version plus masculine (1080 × 1920) : cavalier et son cheval gris en grande photo nette,
   fond anthracite, titre en capitales, notifications sobres sans émoji. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;position:relative;background:#141816;color:#f2efe8;font-family:Inter,system-ui;-webkit-font-smoothing:antialiased}
.glow{position:absolute;border-radius:50%;filter:blur(130px)}
.brand{position:absolute;left:84px;top:150px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:40px}
.brand img{width:68px;height:68px;border-radius:22%}
h1{position:absolute;left:80px;top:270px;font-family:'Inter Display',Inter;font-weight:900;font-size:120px;line-height:.92;letter-spacing:-.045em;text-transform:uppercase}
h1 span{color:#c9a46c}
.photo{position:absolute;left:0;top:600px;width:1080px;height:760px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 60%,transparent 92%)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:45% 40%;display:block;filter:saturate(.85) contrast(1.05)}
.note{position:absolute;display:flex;align-items:center;gap:20px;padding:22px 30px 22px 22px;border-radius:20px;background:#f2efe8;color:#141816;box-shadow:0 22px 50px rgba(0,0,0,.45);z-index:2}
.note i{flex:none;width:58px;height:58px;border-radius:14px;background:#0d3122;display:grid;place-items:center}
.note i svg{width:30px;height:30px;stroke:#c9a46c;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note small{display:block;font-size:20px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b726e}
.note b{display:block;font-size:30px;font-weight:700;line-height:1.2}
.n1{left:60px;top:1250px}.n2{right:60px;top:1350px}
.pitch{position:absolute;left:84px;top:1500px;width:912px;font-size:38px;line-height:1.35;font-weight:500;color:#cfd3cf}
.pitch b{color:#fff;font-weight:700}
.cta{position:absolute;left:84px;top:1630px;display:flex;align-items:center;gap:24px}
.cta div{padding:28px 46px;border-radius:16px;background:#c9a46c;color:#141816;font-weight:800;font-size:38px}
.cta p{font-size:30px;line-height:1.3;color:#a9b3ad}.cta p b{color:#fff}
</style></head><body>
<div class="glow" style="width:800px;height:800px;right:-380px;top:-300px;background:#c9a46c;opacity:.18"></div>
<div class="glow" style="width:900px;height:900px;left:-500px;bottom:-200px;background:#1f5a40;opacity:.5"></div>
<div class="brand"><img src="icon-192.png">Jack&amp;Cie</div>
<h1>Votre cheval.<br><span>Votre gestion.</span></h1>
<div class="photo"><img src="cavalier-barbe-hd.jpg"></div>
<div class="note n1"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></i><div><small>Maréchal</small><b>Jeudi, 10 h · ferrure complète</b></div></div>
<div class="note n2"><i><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/></svg></i><div><small>Budget</small><b>412 € en octobre</b></div></div>
<p class="pitch">Soins, séances, dépenses, demi-pension :<br><b>tout est suivi, rien n’est oublié.</b></p>
<div class="cta"><div>Essayer gratuitement</div><p>Ou tout inclus<br>dès <b>6,90 €/mois</b></p></div>
</body></html>
