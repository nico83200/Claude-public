<!doctype html><html><head><meta charset="utf-8"><style>
/* Publicité story v4 (1080 × 1920) : fond beige pris sur la photo (utilisatrice souriante, téléphone en main),
   la photo se fond dans le fond ; les notifications flottent au-dessus d'elle. */
@font-face{font-family:Fraunces;font-weight:600;src:url(fraunces-600.ttf)}
@font-face{font-family:Fraunces;font-weight:500;font-style:italic;src:url(fraunces-500-italic.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;position:relative;background:linear-gradient(180deg,#f6dcc2 0%,#f2cba7 55%,#efc39d 100%);color:#0d3122;font-family:Inter,system-ui;-webkit-font-smoothing:antialiased}
.brand{position:absolute;left:84px;top:150px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:40px}
.brand img{width:68px;height:68px;border-radius:22%;box-shadow:0 8px 24px rgba(13,49,34,.25)}
h1{position:absolute;left:84px;top:280px;font-family:Fraunces;font-weight:600;font-size:116px;line-height:1;letter-spacing:-.035em}
h1 em{font-style:italic;font-weight:500;color:#9a6a3c}
.sub{position:absolute;left:84px;top:540px;width:900px;font-size:38px;line-height:1.35;font-weight:500;color:#3b3127}
.sub b{font-weight:700;color:#0d3122}
.cta{position:absolute;left:84px;top:680px;display:flex;align-items:center;gap:22px;z-index:3}
.cta div{padding:28px 46px;border-radius:999px;background:#0d3122;color:#fff;font-weight:800;font-size:38px;box-shadow:0 16px 36px rgba(13,49,34,.3)}
.cta p{font-size:30px;line-height:1.3;color:#5a4a3a}.cta p b{color:#0d3122}
.photo{position:absolute;left:-150px;bottom:0;width:1380px;height:920px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.note{position:absolute;display:flex;align-items:center;gap:18px;padding:20px 28px 20px 20px;border-radius:30px;background:#fff;box-shadow:0 22px 50px rgba(110,70,30,.25);z-index:2}
.note i{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:32px}
.note small{display:block;font-size:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9a6a3c}
.note b{display:block;font-size:29px;font-weight:700;line-height:1.2}
.n1{left:60px;top:880px;transform:rotate(-3deg)}
.n2{right:60px;top:960px;transform:rotate(3deg)}
</style><style>
/* Format fil Instagram 4:5 (1080 × 1350) : mêmes éléments resserrés. */
html,body{height:1350px}.brand{top:70px}h1{top:150px;font-size:100px}
.sub{top:375px;font-size:34px}.cta{top:490px}.cta div{padding:24px 40px;font-size:34px}
.photo{left:-30px;width:1140px;height:760px}.n1{left:40px;top:640px}.n2{right:40px;top:730px}
</style></head><body>
<div class="brand"><img src="icon-192.png">Jack&amp;Cie</div>
<h1>Tout est noté.<br><em>Tout est prévu.</em></h1>
<p class="sub">Soins, séances, budget, demi-pension :<br><b>le suivi de votre cheval, en un coup d’œil.</b></p>
<div class="cta"><div>Essayer gratuitement</div><p>Ou tout inclus<br>dès <b>6,90 €/mois</b></p></div>
<div class="photo"><img src="utilisatrice-beige-hd.jpg"></div>
<div class="note n1"><i style="background:#f3e6d2">🩺</i><div><small>Rappel</small><b>Vermifuge dans 3 jours</b></div></div>
<div class="note n2"><i style="background:#dcebe2">✅</i><div><small>Demi-pension</small><b>Léa a noté sa séance</b></div></div>
</body></html>
