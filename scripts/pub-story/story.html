<!doctype html><html><head><meta charset="utf-8"><style>
/* Publicité Instagram en story (1080 × 1920) : accroche, question, prix, bouton, téléphone à droite.
   Bas laissé libre pour l'autocollant « En savoir plus » ajouté par Instagram. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,system-ui;-webkit-font-smoothing:antialiased;position:relative;background:#faf7f1;color:#0d3122}
.glow{position:absolute;border-radius:50%;filter:blur(110px)}
.brand{position:absolute;left:84px;top:200px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:46px;letter-spacing:-.02em}
.brand img{width:76px;height:76px;border-radius:22%;box-shadow:0 8px 20px rgba(13,49,34,.22)}
h1{position:absolute;left:84px;top:390px;font-weight:800;font-size:104px;line-height:1.04;letter-spacing:-.04em;color:#a8875e}
h2{position:absolute;left:84px;top:640px;font-weight:500;font-size:86px;line-height:1.12;letter-spacing:-.03em;color:#0d3122}
.sub{position:absolute;left:84px;top:950px;width:500px;font-size:38px;line-height:1.32;font-weight:500;color:#1f2a24}
.sub b{font-weight:800}
.cta{position:absolute;left:84px;top:1150px;padding:30px 44px;border-radius:22px;background:#0d3122;color:#fff;font-weight:700;font-size:38px;box-shadow:0 14px 30px rgba(13,49,34,.25)}
.phone{position:absolute;left:600px;top:900px;width:430px;height:930px;border-radius:64px;background:#0b0f0d;padding:14px;box-shadow:0 40px 90px rgba(13,49,34,.35);transform:rotate(6deg)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:52px;display:block}
.notch{position:absolute;left:50%;top:26px;width:110px;height:30px;margin-left:-55px;border-radius:16px;background:#0b0f0d}
.badge{position:absolute;left:530px;top:1330px;padding:18px 24px;border-radius:24px;background:#fff;box-shadow:0 18px 44px rgba(0,0,0,.18);font-size:26px;font-weight:700;line-height:1.25;z-index:2}
.badge small{display:block;font-size:20px;font-weight:600;color:#a8875e;letter-spacing:.08em;text-transform:uppercase}
.photo{display:none;position:absolute;right:0;bottom:0;width:860px;height:790px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 20%),linear-gradient(to bottom,transparent 0,#000 18%);-webkit-mask-composite:source-in;mask-composite:intersect}
.photo img{width:100%;height:100%;object-fit:cover;object-position:58% 35%;display:block;filter:saturate(.95) sepia(.08)}
body.photo-mode .photo{display:block}body.photo-mode .phone{display:none}
body.photo-mode .badge{left:60px;top:1300px}body.photo-mode .cta{z-index:2}
body.photo-mode .sub{top:900px;width:900px}body.photo-mode .cta{top:1060px}
</style></head><body><script>if(location.hash==="#photo")document.body.classList.add("photo-mode")</script>
<div class="glow" style="width:900px;height:900px;right:-360px;top:-260px;background:#e7c9a3;opacity:.75"></div>
<div class="glow" style="width:700px;height:700px;left:-300px;bottom:-200px;background:#b9d8c6;opacity:.7"></div>
<div class="glow" style="width:500px;height:500px;right:-120px;bottom:300px;background:#e7dac3;opacity:.6"></div>
<div class="brand"><img src="icon-192.png">Jack&amp;Cie</div>
<h1>Moins de papiers.<br>Plus de cheval.</h1>
<h2>Et si vous passiez<br>à Jack&amp;Cie ?</h2>
<p class="sub">Le suivi de votre cheval,<br>gratuit ou tout inclus dès <b>6,90 € par mois</b></p>
<div class="cta">Essayer gratuitement</div>
<div class="phone"><img src="mobile-accueil.webp"><div class="notch"></div></div><div class="photo"><img src="cavaliere.jpg"></div>
<div class="badge"><small>Rappel</small>Vaccin grippe dans 15 jours</div>
</body></html>
