<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d3122; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Publicité Jack&Cie, 30 s, 1080 × 1920 : trois scènes, les sous-titres, la voix off et quelques bruitages. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="32.5" data-width="1080" data-height="1920">
      <div id="papier" data-composition-id="papier" data-composition-src="compositions/papier.html"
        data-start="0" data-duration="9.75" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="appli" data-composition-id="appli" data-composition-src="compositions/appli.html"
        data-start="9.75" data-duration="16.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="fin" data-composition-id="fin" data-composition-src="compositions/fin.html"
        data-start="26.05" data-duration="6.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="soustitres" data-composition-id="soustitres" data-composition-src="compositions/soustitres.html"
        data-start="0" data-duration="32.5" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Voix off ElevenLabs (fichier fourni), d'un seul tenant : les plans et les sous-titres sont calés sur ses mots. -->
      <audio id="voix" class="clip" src="assets/voice/voix-elevenlabs.mp3" data-start="0.2" data-duration="31.94" data-track-index="3" data-volume="1"></audio>

      <!-- Bruitages : chacun a sa cause à l'écran. -->
      <audio id="sfx-carnet" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.6" data-duration="0.57" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-facture-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.65" data-duration="0.57" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-facture-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.0" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-ordonnance" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.4" data-duration="0.57" data-track-index="4" data-volume="0.28"></audio>
      <audio id="sfx-postit" class="clip" src="assets/sfx/pop.mp3" data-start="7.75" data-duration="0.71" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-tampon" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="8.78" data-duration="2.11" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-aspiration" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="8.97" data-duration="1.4" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-notification" class="clip" src="assets/sfx/notification.mp3" data-start="14.75" data-duration="2.45" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-seances" class="clip" src="assets/sfx/whoosh.mp3" data-start="18.45" data-duration="0.57" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-budget" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="20.75" data-duration="0.57" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-jours" class="clip" src="assets/sfx/whoosh.mp3" data-start="22.7" data-duration="0.57" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-montee" class="clip" src="assets/sfx/riser.mp3" data-start="25.15" data-duration="1.2" data-media-start="6.19" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sfx-marque" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="26.33" data-duration="2.11" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-bouton" class="clip" src="assets/sfx/pop.mp3" data-start="30.33" data-duration="0.71" data-track-index="5" data-volume="0.4"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
