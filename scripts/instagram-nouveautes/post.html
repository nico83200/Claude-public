<!doctype html><html><head><meta charset="utf-8"><style>
/* Publication Instagram 3:4 (1080 × 1440), même charte que les posts carrés de scripts/instagram. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;font-family:Inter,system-ui;-webkit-font-smoothing:antialiased;position:relative}
body.light{background:#faf7f1;color:#0d3122}
body.dark{background:radial-gradient(120% 80% at 0% 0%,#1f5f44 0%,#0d3122 60%,#0a2519 100%);color:#fff}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;letter-spacing:-.02em}
.brand img{width:56px;height:56px;border-radius:22%;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.new{position:absolute;right:72px;top:72px;padding:10px 20px;border-radius:999px;font-weight:800;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
.light .new{background:#0d3122;color:#e7dac3}.dark .new{background:#e7dac3;color:#0d3122}
.txt{position:absolute;left:72px;right:72px;top:190px}
.k{font-weight:700;font-size:25px;letter-spacing:.14em;text-transform:uppercase;color:#a8875e}
.dark .k{color:#d1bb9d}
h1{margin-top:18px;font-weight:800;font-size:76px;line-height:1.02;letter-spacing:-.035em;max-width:900px}
.light h1 em{font-style:normal;color:#a8875e}.dark h1 em{font-style:normal;color:#d1bb9d}
.b{margin-top:24px;font-size:31px;line-height:1.36;font-weight:500;opacity:.84;max-width:860px}
.phone{position:absolute;left:520px;top:640px;width:470px;height:1017px;border-radius:70px;background:#0b0f0d;padding:15px;box-shadow:0 40px 90px rgba(0,0,0,.35)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:56px;display:block}
.notch{position:absolute;left:50%;top:28px;width:120px;height:32px;margin-left:-60px;border-radius:18px;background:#0b0f0d}
.points{position:absolute;left:72px;top:700px;width:420px;display:grid;gap:22px}
.pt{display:flex;gap:16px;align-items:flex-start;font-size:27px;line-height:1.3;font-weight:600}
.pt i{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;font-weight:800}
.light .pt i{background:#0d3122;color:#e7dac3}.dark .pt i{background:#e7dac3;color:#0d3122}
.bubble{position:absolute;padding:22px 26px;border-radius:28px;background:#fff;color:#141915;font-size:26px;line-height:1.3;font-weight:600;box-shadow:0 18px 50px rgba(0,0,0,.25);max-width:430px;z-index:3}
.notif{position:absolute;display:flex;gap:16px;align-items:flex-start;padding:20px 22px;border-radius:26px;background:rgba(255,255,255,.97);color:#141915;box-shadow:0 20px 50px rgba(0,0,0,.28);width:500px;z-index:3}
.notif img{width:52px;height:52px;border-radius:22%}
.notif small{display:block;font-size:18px;color:#6b736d;font-weight:500}
.notif b{display:block;margin-top:2px;font-size:24px}
.notif span{display:block;margin-top:4px;font-size:21px;line-height:1.3;color:#3a413c}
.cta{position:absolute;left:72px;bottom:72px;display:inline-flex;align-items:center;gap:12px;padding:20px 32px;border-radius:999px;font-weight:700;font-size:25px;z-index:2}
.light .cta{background:#0d3122;color:#fff}.dark .cta{background:#fff;color:#0d3122}
.site{position:absolute;left:76px;bottom:36px;font-size:20px;font-weight:600;opacity:.6}
</style></head><body><div id="root"></div>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
document.body.className = d.theme;
let h = `<div class="glow" style="width:620px;height:620px;right:-200px;top:-200px;background:${d.theme === 'dark' ? '#579675' : '#e7dac3'}"></div>
<div class="glow" style="width:520px;height:520px;left:-220px;bottom:-120px;background:${d.theme === 'dark' ? '#a8875e' : '#dcebe2'};opacity:.25"></div>
<div class="brand"><img src="icon-192.png">Jack&amp;Cie</div><div class="new">Nouveau</div>
<div class="txt"><div class="k">${d.k}</div><h1>${d.h}</h1><p class="b">${d.b}</p></div>`;
if (d.points) h += `<div class="points">${d.points.map((t, i) => `<div class="pt"><i>${i + 1}</i><span>${t}</span></div>`).join('')}</div>`;
if (d.img) h += `<div class="phone"><img src="${d.img}"></div>`;
if (d.bubble) h += `<div class="bubble" style="${d.bubble.style}">${d.bubble.text}</div>`;
if (d.notif) h += `<div class="notif" style="${d.notif.style}"><img src="icon-192.png"><div><small>${d.notif.from || 'Jack&amp;Cie · maintenant'}</small><b>${d.notif.t}</b><span>${d.notif.s}</span></div></div>`;
h += `<div class="cta">${d.cta || 'Essai gratuit 14 jours · lien en bio'}</div>`;
document.getElementById('root').innerHTML = h;
</script></body></html>
