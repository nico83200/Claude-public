# /etc/nginx/sites-available/tapikard  (certificat : sudo certbot --nginx -d tapikard.com -d www.tapikard.com)
server {
    listen 80;
    server_name tapikard.com www.tapikard.com;
    return 301 https://tapikard.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tapikard.com;

    # Lignes ajoutées par certbot :
    # ssl_certificate     /etc/letsencrypt/live/tapikard.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tapikard.com/privkey.pem;

    client_max_body_size 3m;   # photos et logos
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /_next/static/ {
        alias /opt/tapikard/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
